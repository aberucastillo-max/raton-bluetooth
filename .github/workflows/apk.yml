name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Misma clave de firma entre compilaciones para poder actualizar la app sin desinstalarla
      - name: Reutilizar clave de depuracion
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-raton-v1

      - name: Compilar
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RatonBluetooth.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RatonBluetooth
          path: RatonBluetooth.apk

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Última versión
          body: Descarga RatonBluetooth.apk desde la tablet e instálalo.
          files: RatonBluetooth.apk
          make_latest: true
